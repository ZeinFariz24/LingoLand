<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Daftar - LingoLand Belajar Bahasa Inggris" />
    <meta name="author" content="LingoLand" />
    <title>Daftar - LingoLand</title>
    <link href="./css/css/all.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="./css/aos.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="./css/bootstrap.css" rel="stylesheet" crossorigin="anonymous" />
  </head>
  <body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="index.html">
          <i class="fa-solid fa-graduation-cap text-warning me-2"></i>
          Lingo<span class="text-warning">Land</span>
        </a>
        <div class="d-flex align-items-center gap-2 ms-auto">
          <div class="form-check form-switch mb-0 d-flex align-items-center">
            <i class="fa-solid fa-sun text-warning me-2"></i>
            <input class="form-check-input" type="checkbox" id="darkModeSwitch"
              aria-label="Toggle dark/light mode"
              style="width: 2.5rem; height: 1.25rem; cursor: pointer;" />
            <i class="fa-solid fa-moon text-primary-emphasis ms-2"></i>
          </div>
          <a href="login.html" class="btn btn-outline-warning rounded-pill fw-bold px-3 ms-2">
            <i class="fa-solid fa-right-to-bracket me-1"></i>Masuk
          </a>
        </div>
      </div>
    </nav>

    <!-- ===== REGISTER ===== -->
    <section class="min-vh-100 d-flex align-items-center position-relative overflow-hidden"
      style="background: linear-gradient(135deg, var(--bs-success-bg-subtle) 0%, var(--bs-primary-bg-subtle) 50%, var(--bs-warning-bg-subtle) 100%);">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-6 col-md-8">
            <div class="card border-0 shadow-lg rounded-4" data-aos="fade-up">
              <div class="card-body p-4 p-lg-5">
                <!-- Logo mini -->
                <div class="text-center mb-4">
                  <div class="bg-warning bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                    <i class="fa-solid fa-user-plus text-warning fs-2"></i>
                  </div>
                  <h3 class="fw-bold">Buat Akun Baru</h3>
                  <p class="text-secondary">Bergabung dengan ribuan anak yang belajar Inggris!</p>
                </div>

                <form novalidate>
                  <div class="row g-3">
                    <!-- Nama lengkap -->
                    <div class="col-md-6">
                      <label for="regName" class="form-label fw-semibold">
                        <i class="fa-solid fa-user text-warning me-1"></i>Nama Lengkap
                      </label>
                      <input type="text" class="form-control rounded-pill border-0 bg-body-tertiary" id="regName"
                        placeholder="Nama anak" required>
                    </div>
                    <!-- Usia -->
                    <div class="col-md-3 col-6">
                      <label for="regAge" class="form-label fw-semibold">
                        <i class="fa-solid fa-cake-candles text-warning me-1"></i>Usia
                      </label>
                      <select class="form-select rounded-pill border-0 bg-body-tertiary" id="regAge">
                        <option value="">Pilih</option>
                        <option>3-4 tahun</option>
                        <option>5-6 tahun</option>
                        <option selected>7-8 tahun</option>
                        <option>9-10 tahun</option>
                        <option>11-12 tahun</option>
                      </select>
                    </div>
                    <!-- Jenis kelamin -->
                    <div class="col-md-3 col-6">
                      <label class="form-label fw-semibold">
                        <i class="fa-solid fa-venus-mars text-warning me-1"></i>Gender
                      </label>
                      <div class="d-flex gap-2 pt-1">
                        <div class="form-check">
                          <input class="form-check-input" type="radio" name="gender" id="genderL">
                          <label class="form-check-label small" for="genderL">Laki-laki</label>
                        </div>
                        <div class="form-check">
                          <input class="form-check-input" type="radio" name="gender" id="genderP" checked>
                          <label class="form-check-label small" for="genderP">Perempuan</label>
                        </div>
                      </div>
                    </div>
                    <!-- Email orang tua -->
                    <div class="col-md-6">
                      <label for="regEmail" class="form-label fw-semibold">
                        <i class="fa-solid fa-envelope text-primary me-1"></i>Email Orang Tua
                      </label>
                      <input type="email" class="form-control rounded-pill border-0 bg-body-tertiary" id="regEmail"
                        placeholder="email@orangtua.com" required>
                    </div>
                    <!-- No HP -->
                    <div class="col-md-6">
                      <label for="regPhone" class="form-label fw-semibold">
                        <i class="fa-solid fa-phone text-primary me-1"></i>No. HP
                      </label>
                      <input type="tel" class="form-control rounded-pill border-0 bg-body-tertiary" id="regPhone"
                        placeholder="0812xxxxxx">
                    </div>
                    <!-- Password -->
                    <div class="col-md-6">
                      <label for="regPassword" class="form-label fw-semibold">
                        <i class="fa-solid fa-lock text-success me-1"></i>Password
                      </label>
                      <div class="input-group">
                        <input type="password" class="form-control rounded-start-pill border-0 bg-body-tertiary" id="regPassword"
                          placeholder="Buat password" required>
                        <button class="btn btn-outline-secondary border-0 bg-body-tertiary rounded-end-pill" type="button" id="toggleRegPassword">
                          <i class="fa-solid fa-eye"></i>
                        </button>
                      </div>
                    </div>
                    <!-- Confirm Password -->
                    <div class="col-md-6">
                      <label for="regConfirm" class="form-label fw-semibold">
                        <i class="fa-solid fa-lock text-success me-1"></i>Konfirmasi Password
                      </label>
                      <input type="password" class="form-control rounded-pill border-0 bg-body-tertiary" id="regConfirm"
                        placeholder="Ulangi password" required>
                    </div>
                  </div>
                  <!-- Terms -->
                  <div class="form-check mt-3">
                    <input class="form-check-input" type="checkbox" id="termsCheck" required>
                    <label class="form-check-label small" for="termsCheck">
                      Saya setuju dengan <a href="#" class="text-warning text-decoration-none fw-semibold">Syarat & Ketentuan</a>
                      dan <a href="#" class="text-warning text-decoration-none fw-semibold">Kebijakan Privasi</a>
                    </label>
                  </div>
                  <!-- Submit -->
                  <button type="submit" class="btn btn-warning btn-lg rounded-pill w-100 fw-bold mt-4 mb-3 shadow-sm">
                    <i class="fa-solid fa-rocket me-2"></i>Daftar Gratis Sekarang
                  </button>
                  <!-- Social -->
                  <div class="text-center mb-3">
                    <small class="text-secondary">atau daftar dengan</small>
                  </div>
                  <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-primary rounded-pill flex-fill fw-semibold">
                      <i class="fa-brands fa-google me-1"></i>Google
                    </button>
                    <button type="button" class="btn btn-outline-dark rounded-pill flex-fill fw-semibold">
                      <i class="fa-brands fa-facebook me-1"></i>Facebook
                    </button>
                  </div>
                </form>
                <!-- Login link -->
                <div class="text-center mt-4">
                  <small class="text-secondary">
                    Sudah punya akun?
                    <a href="login.html" class="text-warning fw-bold text-decoration-none">Masuk di sini</a>
                  </small>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== SCRIPTS ===== -->
    <script src="./js/js/all.js" crossorigin="anonymous"></script>
    <script src="./js/aos.js" crossorigin="anonymous"></script>
    <script src="./js/bootstrap.bundle.js" crossorigin="anonymous"></script>
    <script src="./js/jquery4.js" crossorigin="anonymous"></script>
    <script>
      AOS.init({ duration: 800, once: true });
      (function() {
        const html = document.documentElement;
        const toggle = document.getElementById('darkModeSwitch');
        const saved = localStorage.getItem('lingoland-theme') || 'light';
        html.setAttribute('data-bs-theme', saved);
        if (toggle) toggle.checked = saved === 'dark';
        if (toggle) {
          toggle.addEventListener('change', function() {
            const t = this.checked ? 'dark' : 'light';
            html.setAttribute('data-bs-theme', t);
            localStorage.setItem('lingoland-theme', t);
          });
        }
      })();
      // Toggle password
      document.getElementById('toggleRegPassword')?.addEventListener('click', function() {
        const pw = document.getElementById('regPassword');
        const icon = this.querySelector('i');
        if (pw.type === 'password') {
          pw.type = 'text';
          icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
          pw.type = 'password';
          icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
      });
    </script>
  </body>
</html>
