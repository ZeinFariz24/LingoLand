<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login - LingoLand Belajar Bahasa Inggris" />
    <meta name="author" content="LingoLand" />
    <title>Login - LingoLand</title>
    <link href="./css/css/all.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="./css/aos.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="./css/bootstrap.css" rel="stylesheet" crossorigin="anonymous" />
  </head>
  <body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="index.html">
          <i class="fa-solid fa-graduation-cap text-warning me-2"></i>
          Lingo<span class="text-warning">Land</span>
        </a>
        <div class="d-flex align-items-center gap-2 ms-auto">
          <div class="form-check form-switch mb-0 d-flex align-items-center">
            <i class="fa-solid fa-sun text-warning me-2"></i>
            <input class="form-check-input" type="checkbox" id="darkModeSwitch"
              aria-label="Toggle dark/light mode"
              style="width: 2.5rem; height: 1.25rem; cursor: pointer;" />
            <i class="fa-solid fa-moon text-primary-emphasis ms-2"></i>
          </div>
          <a href="register.html" class="btn btn-warning rounded-pill fw-bold px-3 shadow-sm ms-2">
            <i class="fa-solid fa-user-plus me-1"></i>Daftar
          </a>
        </div>
      </div>
    </nav>

    <!-- ===== LOGIN ===== -->
    <section class="min-vh-100 d-flex align-items-center position-relative overflow-hidden"
      style="background: linear-gradient(135deg, var(--bs-warning-bg-subtle) 0%, var(--bs-primary-bg-subtle) 50%, var(--bs-success-bg-subtle) 100%);">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-5 col-md-7">
            <div class="card border-0 shadow-lg rounded-4" data-aos="fade-up">
              <div class="card-body p-4 p-lg-5">
                <!-- Logo mini -->
                <div class="text-center mb-4">
                  <div class="bg-warning bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                    <i class="fa-solid fa-graduation-cap text-warning fs-2"></i>
                  </div>
                  <h3 class="fw-bold">Selamat Datang Kembali!</h3>
                  <p class="text-secondary">Masuk ke akun LingoLand Anda</p>
                </div>

                <form novalidate>
                  <!-- Email -->
                  <div class="mb-3">
                    <label for="loginEmail" class="form-label fw-semibold">
                      <i class="fa-solid fa-envelope text-warning me-1"></i>Email
                    </label>
                    <input type="email" class="form-control form-control-lg rounded-pill border-0 bg-body-tertiary" id="loginEmail"
                      placeholder="nama@email.com" required>
                  </div>
                  <!-- Password -->
                  <div class="mb-3">
                    <label for="loginPassword" class="form-label fw-semibold">
                      <i class="fa-solid fa-lock text-warning me-1"></i>Password
                    </label>
                    <div class="input-group">
                      <input type="password" class="form-control form-control-lg rounded-start-pill border-0 bg-body-tertiary" id="loginPassword"
                        placeholder="Masukkan password" required>
                      <button class="btn btn-outline-secondary border-0 bg-body-tertiary rounded-end-pill" type="button" id="togglePassword">
                        <i class="fa-solid fa-eye"></i>
                      </button>
                    </div>
                  </div>
                  <!-- Remember & Forgot -->
                  <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="rememberMe">
                      <label class="form-check-label small" for="rememberMe">Ingat saya</label>
                    </div>
                    <a href="forgot-password.html" class="small text-decoration-none text-warning fw-semibold">
                      Lupa password?
                    </a>
                  </div>
                  <!-- Submit -->
                  <button type="submit" class="btn btn-warning btn-lg rounded-pill w-100 fw-bold mb-3 shadow-sm">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Masuk
                  </button>
                  <!-- Social login -->
                  <div class="text-center mb-3">
                    <small class="text-secondary">atau masuk dengan</small>
                  </div>
                  <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-primary rounded-pill flex-fill fw-semibold">
                      <i class="fa-brands fa-google me-1"></i>Google
                    </button>
                    <button type="button" class="btn btn-outline-dark rounded-pill flex-fill fw-semibold">
                      <i class="fa-brands fa-facebook me-1"></i>Facebook
                    </button>
                  </div>
                </form>
                <!-- Register link -->
                <div class="text-center mt-4">
                  <small class="text-secondary">
                    Belum punya akun?
                    <a href="register.html" class="text-warning fw-bold text-decoration-none">Daftar sekarang</a>
                  </small>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== SCRIPTS ===== -->
    <script src="./js/js/all.js" crossorigin="anonymous"></script>
    <script src="./js/aos.js" crossorigin="anonymous"></script>
    <script src="./js/bootstrap.bundle.js" crossorigin="anonymous"></script>
    <script src="./js/jquery4.js" crossorigin="anonymous"></script>
    <script>
      AOS.init({ duration: 800, once: true });

      // Dark mode
      (function() {
        const html = document.documentElement;
        const toggle = document.getElementById('darkModeSwitch');
        const saved = localStorage.getItem('lingoland-theme') || 'light';
        html.setAttribute('data-bs-theme', saved);
        if (toggle) toggle.checked = saved === 'dark';
        if (toggle) {
          toggle.addEventListener('change', function() {
            const t = this.checked ? 'dark' : 'light';
            html.setAttribute('data-bs-theme', t);
            localStorage.setItem('lingoland-theme', t);
          });
        }
      })();

      // Toggle password visibility
      document.getElementById('togglePassword')?.addEventListener('click', function() {
        const pw = document.getElementById('loginPassword');
        const icon = this.querySelector('i');
        if (pw.type === 'password') {
          pw.type = 'text';
          icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
          pw.type = 'password';
          icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
      });
    </script>
  </body>
</html>
